# Configurações do Gradle para o projeto inteiro.
# Ajustes feitos pela IDE (Android Studio) sobrescrevem este arquivo.
# https://docs.gradle.org/current/userguide/build_environment.html

# Argumentos da JVM usados pelo daemon do Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compila os módulos em paralelo quando possível.
org.gradle.parallel=true

# Pula a fase de configuração quando nada que a afete mudou.
org.gradle.configuration-cache=true

# AndroidX em vez das bibliotecas de suporte antigas.
android.useAndroidX=true

# Estilo de código Kotlin: "official" ou "obsolete".
kotlin.code.style=official
